# Builds and tests the .NET application on every platform, then publishes one
# self-contained single-file binary per target. Running the publish on the same
# operating system as the target keeps the native assets (Skia, Avalonia) honest.
#
# Notarisation, an .app bundle and installers (dmg / msi / deb) are deliberately
# not here yet: they need signing credentials, and the single file is what the
# application is designed to ship as.

name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # The compiler's analysers with warnings as errors, then the CRAP gate over both test
      # projects. Neither needs Node, a signing key or a GUI, and one leg is enough: the same
      # sources analysed three times would say the same thing three times.
      - name: Static analysis
        run: ./scripts/analyse.sh

      - name: Complexity and coverage
        run: ./scripts/crap.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # The UI tests draw their windows with Skia, which needs the system's font configuration to
      # find a font at all. Without it every frame a test captures is blank.
      - name: System fonts (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Test
        run: dotnet test Worksheet.slnx --configuration Release

      # What the UI tests saw, drawn on this platform: a failing test can be looked at rather than
      # guessed at, and the three platforms can be compared side by side.
      - name: Keep the frames the UI tests drew
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-frames-${{ matrix.os }}
          path: artifacts/ui-tests/**
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package (${{ matrix.rid }})
    needs: [test, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          # Published from the x64 runner: a RID-specific build needs the runtime pack, not a
          # Windows machine of that architecture, and nothing here is native-AOT compiled.
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # A tag names a version, so the executable says that version: it is what the MCP handshake
      # reports and what every package manager would otherwise disagree with. A branch build has
      # no version of its own and keeps the one in Directory.Build.props.
      - name: Which version this is
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(dotnet msbuild src/Worksheet.Desktop/Worksheet.Desktop.csproj -getProperty:Version -nologo | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >
          dotnet publish src/Worksheet.Desktop
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output out
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none

      # Skia and HarfBuzz ship .pdb files beside their native libraries even when the
      # libraries themselves are embedded. Drop the symbols, give each platform its own
      # file name (they all share one release), and prove the promise: one file.
      - name: One file per platform
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/*.pdb
          name="worksheet-${{ matrix.rid }}"
          if [ -f out/Worksheet.Desktop.exe ]; then
            mv out/Worksheet.Desktop.exe "out/$name.exe"
          else
            mv out/Worksheet.Desktop "out/$name"
          fi
          ls -lh out
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worksheet-${{ matrix.rid }}
          path: out/*
          # The README points at nightly.link for the newest build of main, which serves the
          # newest artefact of this workflow. A week is not long enough for that promise.
          retention-days: 90
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
          # The frames the UI tests drew are artefacts of this run too, and a release cannot take
          # a directory. Only the platform binaries belong to the tag.
          pattern: worksheet-*

      - name: Attach every platform to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          # A re-run of a tag must not fail on a release that is already there.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Worksheet.net $GITHUB_REF_NAME" \
              --generate-notes
          fi

  # The package managers need what only a tag gives: a URL that never changes and the sha256 of
  # exactly the file behind it. Both jobs below work from the assets the release job attached, so
  # main is never published — there would be no version to publish it under.

  publish-tap:
    name: Publish the Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the release's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
          pattern: worksheet-*

      - name: Generate the formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          VERSION="$version" \
          SHA_MACOS_ARM64="$(sha256sum artifacts/worksheet-osx-arm64 | awk '{print $1}')" \
          SHA_MACOS_X64="$(sha256sum artifacts/worksheet-osx-x64 | awk '{print $1}')" \
          SHA_LINUX_ARM64="$(sha256sum artifacts/worksheet-linux-arm64 | awk '{print $1}')" \
          SHA_LINUX_X64="$(sha256sum artifacts/worksheet-linux-x64 | awk '{print $1}')" \
            bash scripts/generate-homebrew-formula.sh > dist/worksheet.rb

      # A formula is a file in a tap and nothing more; the tap is a repository like any other, so
      # the push is a clone, a copy and a commit — and nothing is committed when the version is
      # already there, which is what a re-run of this job looks like.
      - name: Update the tap
        env:
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PUBLISHER_TOKEN}" ]]; then
            echo "::error::PUBLISHER_TOKEN is not configured for this repository"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISHER_TOKEN}@github.com/d-led/homebrew-d-led.git" dist/tap
          cp dist/worksheet.rb dist/tap/worksheet.rb
          git -C dist/tap config user.name "Dmitry Ledentsov"
          git -C dist/tap config user.email "dmlled@yahoo.com"
          git -C dist/tap add worksheet.rb
          if git -C dist/tap diff --cached --quiet; then
            echo "The formula is up to date; nothing to push"
          else
            git -C dist/tap commit -m "worksheet ${version}"
            git -C dist/tap push
          fi

  # A job-level `if` cannot read secrets, so the key is published as an output here. Naming it in
  # the condition instead makes GitHub reject the whole workflow file.
  choco-key:
    name: Check for the Chocolatey API key
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: echo "configured=${{ env.CHOCOLATEY_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  publish-choco:
    name: Publish the Chocolatey package
    needs: [release, choco-key]
    if: needs.choco-key.outputs.configured == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the Windows executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worksheet-win-x64
          path: artifacts

      - name: Pack and push
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" \
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/worksheet-win-x64.exe" \
          SHA256="$(sha256sum artifacts/worksheet-win-x64.exe | awk '{print $1}')" \
            bash scripts/generate-chocolatey-package.sh
          choco push "dist/choco/worksheet.net.${version}.nupkg" \
            --source https://push.chocolatey.org/ --api-key "${CHOCOLATEY_API_KEY}"
