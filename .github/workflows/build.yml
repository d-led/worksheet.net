# Builds and tests the .NET application on every platform, then publishes one
# self-contained single-file binary per target. Running the publish on the same
# operating system as the target keeps the native assets (Skia, Avalonia) honest.
#
# Notarisation, an .app bundle and installers (dmg / msi / deb) are deliberately
# not here yet: they need signing credentials, and the single file is what the
# application is designed to ship as.

name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Worksheet.slnx --configuration Release

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/Worksheet.Desktop
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output out
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none

      # Skia and HarfBuzz ship .pdb files beside their native libraries even when the
      # libraries themselves are embedded. Drop the symbols, give each platform its own
      # file name (they all share one release), and prove the promise: one file.
      - name: One file per platform
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/*.pdb
          name="worksheet-${{ matrix.rid }}"
          if [ -f out/Worksheet.Desktop.exe ]; then
            mv out/Worksheet.Desktop.exe "out/$name.exe"
          else
            mv out/Worksheet.Desktop "out/$name"
          fi
          ls -lh out
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 1

      - uses: actions/upload-artifact@v7
        with:
          name: worksheet-${{ matrix.rid }}
          path: out/*
          # The README points at nightly.link for the newest build of main, which serves the
          # newest artefact of this workflow. A week is not long enough for that promise.
          retention-days: 90
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach every platform to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Worksheet $GITHUB_REF_NAME" \
            --generate-notes
